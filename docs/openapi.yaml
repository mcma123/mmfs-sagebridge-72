openapi: 3.0.3
info:
  title: SageBridge Documents API
  version: 1.0.0
servers:
  - url: /api/v1/documents
  - url: /api/v1/accounting/documents
  - url: /api/v1/accounting
  - url: /api/v1/banking
paths:
  /companies/{companyId}/tree:
    get:
      summary: Fetch tree or subtree
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
        - in: query
          name: folderId
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Tree data
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
  /folders/{id}:
    get:
      summary: Folder details + breadcrumb
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Folder details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDetail'
    patch:
      summary: Rename or update metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
    delete:
      summary: Soft delete folder
      responses:
        '204':
          description: Deleted
  /folders:
    post:
      summary: Create folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolder'
      responses:
        '201':
          description: Created folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
  /folders/{id}/children:
    get:
      summary: List child folders/documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: Children list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenList'
  /folders/{id}/move:
    post:
      summary: Move folder to a new parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newParentId:
                  type: integer
      responses:
        '200':
          description: Moved folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
  /folders/{id}/template:
    post:
      summary: Apply a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
      responses:
        '200':
          description: Template applied
  /folders/{id}/upload:
    post:
      summary: Upload file(s)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
  /documents/{id}:
    get:
      summary: Get document metadata and signed URL
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
    patch:
      summary: Update document metadata/tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
  
  # Banking Import
  /banking/import/sessions:
    get:
      summary: List import sessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportSession'
    post:
      summary: Create a new import session
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSession'
  /banking/import/sessions/{id}:
    get:
      summary: Get session details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionDetail'
  /banking/import/sessions/{id}/analyze:
    post:
      summary: Analyze CSV headers and delimiter
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvAnalysis'
  /banking/import/sessions/{id}/stage:
    post:
      summary: Stage rows with mapping and transforms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
      responses:
        '200':
          description: Staging result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: integer
  /banking/import/sessions/{id}/rows/{rowId}:
    patch:
      summary: Edit a staged row
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: rowId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated row
  /banking/import/sessions/{id}/commit:
    post:
      summary: Commit staged rows to accounting destinations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationSelection'
      responses:
        '200':
          description: Commit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
  /banking/import/templates:
    get:
      summary: List mapping templates
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportMappingTemplate'
    post:
      summary: Create a mapping template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMappingTemplate'
      responses:
        '201':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportMappingTemplate'

components:
  schemas:
    ImportSession:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        status:
          type: string
        totals:
          $ref: '#/components/schemas/ImportSessionTotals'
    ImportSessionTotals:
      type: object
      properties:
        count: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        duplicate: { type: integer }
        excluded: { type: integer }
        debitTotal: { type: number }
        creditTotal: { type: number }
    ImportSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ImportSession'
        - type: object
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/NormalizedTransaction'
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ImportError'
    CsvAnalysis:
      type: object
      properties:
        delimiter:
          type: string
        headers:
          type: array
          items: { type: string }
        recordCount:
          type: integer
    ImportMappingTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        bank: { type: string }
        headerMap:
          type: object
          additionalProperties: { type: string }
        transforms:
          type: object
          properties:
            invertSigns: { type: boolean }
            fixedCurrency: { type: string }
            defaultAccountCode: { type: string }
    NormalizedTransaction:
      type: object
      properties:
        id: { type: string }
        date: { type: string }
        description: { type: string }
        amount: { type: number }
        debit: { type: number }
        credit: { type: number }
        accountCode: { type: string }
        reference: { type: string }
        currency: { type: string }
        validationStatus: { type: string }
        duplicateFlag: { type: boolean }
        excluded: { type: boolean }
    ImportError:
      type: object
      properties:
        id: { type: string }
        rowIndex: { type: integer }
        field: { type: string }
        code: { type: string }
        message: { type: string }
    DestinationSelection:
      type: object
      properties:
        journalEntries: { type: boolean }
        trialBalance: { type: boolean }
        chartOfAccounts: { type: boolean }
    CommitResult:
      type: object
      properties:
        sessionId: { type: string }
        success: { type: boolean }
        committedRows: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportError' }
        reportUrl: { type: string }
                  items:
                    type: string
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
  /documents/{id}/move:
    post:
      summary: Move document between folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetFolderId:
                  type: integer
      responses:
        '200':
          description: Moved document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
  /documents/{id}/versions:
    get:
      summary: List versions
      responses:
        '200':
          description: Versions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentVersion'

  # Accounting — Entities
  /accounting/entities/{id}:
    get:
      summary: Get an accounting entity by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Not found
    delete:
      summary: Soft delete an entity (if not referenced)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '409':
          description: Conflict (referenced by journal lines)

  # Accounting — Journals
  /accounting/journals/{id}:
    get:
      summary: Get a journal with its lines
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Journal and lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalDetail'
        '404':
          description: Not found
  /accounting/journals/{id}/void:
    post:
      summary: Void a posted journal by posting a full reversal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Reversal posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  reversal_journal_id:
                    type: integer

components:
  schemas:
    Entity:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        name: { type: string }
        status: { type: string }
        currency: { type: string }
        country: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    Journal:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        reference: { type: string }
        description: { type: string }
        created_by: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        voided_at: { type: string, format: date-time, nullable: true }
    JournalLine:
      type: object
      properties:
        id: { type: integer }
        journal_id: { type: integer }
        account_id: { type: integer }
        entity_id: { type: integer, nullable: true }
        date: { type: string, format: date }
        debit: { type: number }
        credit: { type: number }
        memo: { type: string }
        created_at: { type: string, format: date-time }
    JournalDetail:
      type: object
      properties:
        journal:
          $ref: '#/components/schemas/Journal'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
    Folder:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        parent_id: { type: integer, nullable: true }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [company, country, cedant, category, treaty_section, generic] }
        path: { type: string }
        depth: { type: integer }
        order_index: { type: integer }
    FolderDetail:
      allOf:
        - $ref: '#/components/schemas/Folder'
        - type: object
          properties:
            breadcrumb:
              type: array
              items:
                $ref: '#/components/schemas/Folder'
    ChildrenList:
      type: object
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    CreateFolder:
      type: object
      required: [parent_id, name, type]
      properties:
        parent_id: { type: integer }
        name: { type: string }
        type: { type: string }
    Document:
      type: object
      properties:
        id: { type: integer }
        folder_id: { type: integer }
        name: { type: string }
        ext: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        storage_key: { type: string }
        checksum_sha256: { type: string }
        version: { type: integer }
    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          properties:
            signed_url: { type: string }
    DocumentVersion:
      type: object
      properties:
        version: { type: integer }
        created_at: { type: string, format: date-time }